# 10.13. GitHub Actions konfiguráció (.github/workflows/tests.yml)
# A GitHub csak a tároló gyökerében lévő .github/workflows mappát figyeli;
# itt mintaként szerepel. A "composer test" parancsot a composer.json
# "scripts" része (10.14. kódpélda) definiálja.

name: PHPUnit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install

      - name: Run tests
        run: composer test
